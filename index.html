<!doctype html>
<html lang="ar-MA" dir="rtl"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقرير المازوط اليومي</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:#182e48;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:520px;margin:auto;padding:22px 20px}h1{font-size:28px;line-height:40px;margin:0}time{display:block;line-height:32px;margin-bottom:17px}.head,.row{display:grid;grid-template-columns:minmax(0,188fr) minmax(0,154fr);gap:8px;text-align:center}.head{background:#284a75;color:white;border-radius:10px;height:44px;align-items:center;font-weight:600;margin-bottom:11px}.head button{height:44px;background:none;color:inherit;padding:0;font-size:inherit}.row{margin-bottom:10px}.plate,.qty{height:60px;border-radius:12px}.plate{display:grid;place-items:center;background:#e5eef8;font-size:21px;font-weight:600}.plate.plate3{grid-template-columns:1fr auto 1fr;gap:6px}.plate .pnum,.plate .pa{text-align:center}.plate .pnum{text-align:end}.qty{width:100%;text-align:center;font-size:23px;border:1px solid #bfccd6;color:inherit;background:white}.qty::placeholder{color:#657688}button,input{font-family:inherit}button{cursor:pointer;border:none;font-weight:650}.total{border-top:1px solid #c8d4df;margin-top:25px;padding:18px 8px 26px;display:flex;justify-content:space-between;font-size:20px;font-weight:650}.send{background:#127153;color:white;width:100%;height:56px;border-radius:14px;font-size:19px}dialog{width:min(94vw,420px);max-height:85vh;border:1px solid #bfccd6;border-radius:14px;color:inherit}dialog::backdrop{background:#182e4888}dialog h2{margin-top:0}dialog input,dialog button{min-height:44px;border:1px solid #bfccd6;border-radius:8px;padding:8px;font-size:16px}dialog input{min-width:0;width:100%}.editrow{display:flex;gap:6px;margin:6px 0}.actions{display:flex;gap:8px;margin:12px 0}output{font-variant-numeric:tabular-nums}#err{color:#982828}.hint{font-size:14px;line-height:22px;color:#40566d;background:#eef3f8;border-radius:10px;padding:10px;margin:8px 0}@media print{.send,#manage,dialog,.hint{display:none!important}main{max-width:none;padding:0}body{background:white}}
</style>
<main><h1>تقرير المازوط اليومي</h1><time id="today"></time>
<form id="report"><div class="head"><button type="button" id="manage" aria-label="رقم الشاحنة، تعديل اللائحة ورقم واتساب">رقم الشاحنة</button><span>المازوط (لتر)</span></div>
<div id="rows"></div><div class="total"><span>المجموع</span><output id="sum">0 لتر</output></div><button class="send">إرسال عبر WhatsApp</button></form></main>
<dialog id="settings"><form id="editor"><h2>تعديل اللائحة</h2><label>رقم WhatsApp بالصيغة الدولية (اختياري)<input id="phone" type="tel" dir="ltr" placeholder="اتركه خاوي واختار المحادثة" autocomplete="off"></label><p class="hint"><strong>كيفاش كيوصل التقرير:</strong> ثبّت رقم WhatsApp الخاص بك مرة واحدة (بالصيغة الدولية)، من بعد كل إرسال يفتح WhatsApp مباشرة إلى محادثتك — بلا chooser ولا Gmail. خليه خاوي إلا بغيت اختيار المحادثة بنفسك.</p><div id="plates"></div><button type="button" id="add">إضافة شاحنة</button><p role="alert" id="err"></p><div class="actions"><button>حفظ</button><button type="button" id="cancel">إلغاء</button></div></form></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), key='diesel.daily.config.v1';
const initial='2829 A 43|6280 A 4|7287 A 48|7745 A 42|1518 A 62|34226 A 48|11271 A 24|5778 A 47|45652 A 15|3465 A 25|31208 A 59|38236 A 40|2009 A 29|2706 A 19|73779 A 13'.split('|');
let list=initial.map((plate,i)=>({id:String(i),plate})), phone='', amounts=new Map();
try{const c=JSON.parse(localStorage.getItem(key));if(c&&Array.isArray(c.list)&&c.list.every(r=>typeof r.id==='string'&&typeof r.plate==='string')&&typeof c.phone==='string'){list=c.list;phone=c.phone}}catch{}
const digits=s=>s.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776);
function value(s){return Number(digits(s.trim()).replace(/[,٫]/g,'.'))}
function fmt(n){return new Intl.NumberFormat('en-US',{useGrouping:false,maximumFractionDigits:3}).format(n)}
function total(){return list.reduce((n,r)=>n+Math.round((value(amounts.get(r.id)||'')||0)*1000),0)/1000}
function render(){const rows=$('#rows');rows.replaceChildren();for(const r of list){const label=document.createElement('label'),plate=document.createElement('span'),q=document.createElement('input');label.className='row';plate.className='plate';plate.dir='ltr';const pm=r.plate.match(/^(\S+)\s+A\s+(\S+)$/);if(pm){plate.classList.add('plate3');const a=document.createElement('span');a.className='pnum';a.textContent=pm[1];const b=document.createElement('span');b.className='pa';b.textContent='A';const c=document.createElement('span');c.className='pnum';c.textContent=pm[2];plate.append(a,b,c)}else{plate.textContent=r.plate}q.className='qty';q.dir='ltr';q.inputMode='decimal';q.placeholder='0';q.value=amounts.get(r.id)||'';q.oninput=()=>{const raw=q.value.trim().replace(/\s+/g,'');const s=digits(raw);const ok=!raw||/^\d+(?:[.,٫]\d{0,3})?$/.test(s)&&Number.isSafeInteger(Math.round(value(s)*1000));q.setCustomValidity(ok?'':'دخل عدد لترات صحيح، حتى 3 أرقام بعد الفاصلة');q.style.borderColor=ok?'':'#982828';amounts.set(r.id,ok?q.value:'');$('#sum').textContent=fmt(total())+' لتر'};label.append(plate,q);rows.append(label)}$('#sum').textContent=fmt(total())+' لتر'}
function date(){const now=new Date();$('#today').textContent=new Intl.DateTimeFormat('ar-MA-u-nu-latn',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(now);return $('#today').textContent}
function clock(){date();const n=new Date();setTimeout(clock,new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n+50)}clock();document.addEventListener('visibilitychange',date);
function editRow(r){const line=document.createElement('div'),i=document.createElement('input'),b=document.createElement('button');line.className='editrow';i.dir='ltr';i.required=true;i.value=r.plate;i.dataset.id=r.id;i.setAttribute('aria-label','الماتريكول');b.type='button';b.textContent='حذف';b.onclick=()=>line.remove();line.append(i,b);$('#plates').append(line);return i}
function manage(msg=''){$('#phone').value=phone;$('#plates').replaceChildren();list.forEach(editRow);$('#err').textContent=msg;$('#settings').showModal()}
$('#manage').onclick=()=>manage();$('#add').onclick=()=>editRow({id:crypto.randomUUID(),plate:''}).focus();$('#cancel').onclick=()=>$('#settings').close();
$('#editor').onsubmit=e=>{e.preventDefault();const p=digits($('#phone').value).replace(/[\s()-]/g,'').replace(/^\+/,'');if(p&&!/^[1-9]\d{6,14}$/.test(p))return $('#err').textContent='راجع الرقم الدولي مع رمز البلد.';const next=[...document.querySelectorAll('#plates input')].map(i=>({id:i.dataset.id,plate:i.value.trim().toUpperCase().replace(/\s+/g,' ')}));if(next.some(r=>!r.plate)||new Set(next.map(r=>r.plate)).size!==next.length)return $('#err').textContent='راجع الماتريكولات الفارغة أو المكررة.';try{localStorage.setItem(key,JSON.stringify({list:next,phone:p}))}catch{return $('#err').textContent='المتصفح ما سمحش بالحفظ المحلي.'}list=next;phone=p;render();$('#settings').close()};
function message(){return ['تقرير المازوط اليومي — '+date(),...list.map(r=>r.plate+': '+fmt(value(amounts.get(r.id)||''))+' لتر'),'المجموع: '+fmt(total())+' لتر'].join('\n')}
$('#report').onsubmit=async e=>{e.preventDefault();const canvas=buildReportCanvas();const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));const file=new File([blob],'diesel-report-'+new Date().toISOString().slice(0,10)+'.png',{type:'image/png'});if(window.navigator.canShare && window.navigator.canShare({files:[file]})){try{await window.navigator.share({files:[file],title:'تقرير المازوط اليومي',text:message()});return}catch(err){if(err&&err.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();URL.revokeObjectURL(a.href);const text=encodeURIComponent(message());const fallback=phone?'https://wa.me/'+phone+'?text='+text:'https://wa.me/?text='+text;const target=phone?'https://wa.me/'+phone+'?text='+text:'whatsapp://send?text='+text;const t=setTimeout(()=>{window.location.href=fallback},1200);const cancel=()=>clearTimeout(t);document.addEventListener('visibilitychange',cancel,{once:true});window.addEventListener('pagehide',cancel,{once:true});window.location.href=target};render();
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function buildReportCanvas(){const scale=2,W=390*scale,H=825*scale;const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,W,H);ctx.fillStyle='#182e48';ctx.font='bold '+28*scale+'px Arial';ctx.textAlign='right';ctx.textBaseline='alphabetic';ctx.fillText('تقرير المازوط اليومي',370*scale,52*scale);ctx.font=16*scale+'px Arial';ctx.fillText(date(),370*scale,84*scale);ctx.fillStyle='#284a75';roundRect(ctx,16*scale,101*scale,358*scale,42*scale,6*scale);ctx.fill();ctx.fillStyle='white';ctx.font=17*scale+'px Arial';ctx.textAlign='center';ctx.fillText('رقم الشاحنة',128*scale,128*scale);ctx.fillText('المازوط (لتر)',303*scale,128*scale);list.forEach((r,i)=>{const y=145+40*i;ctx.fillStyle=i%2===0?'#eef3f8':'white';ctx.fillRect(16*scale,y*scale,358*scale,40*scale);const pm=r.plate.match(/^(\S+)\s+A\s+(\S+)$/);ctx.fillStyle='#182e48';ctx.font=20*scale+'px Arial';const ly=(y+27)*scale;if(pm){ctx.textAlign='right';ctx.fillText(pm[1],112*scale,ly);ctx.textAlign='center';ctx.fillText('A',139*scale,ly);ctx.textAlign='right';ctx.fillText(pm[2],184*scale,ly)}else{ctx.textAlign='center';ctx.fillText(r.plate,128*scale,ly)}ctx.textAlign='center';ctx.fillText(fmt(value(amounts.get(r.id)||'')),303*scale,ly)});ctx.fillStyle='#e2ece8';roundRect(ctx,16*scale,754*scale,358*scale,52*scale,7*scale);ctx.fill();ctx.fillStyle='#182e48';ctx.font='bold '+22*scale+'px Arial';ctx.textAlign='center';ctx.fillText('المجموع',128*scale,788*scale);ctx.fillText(fmt(total())+' لتر',303*scale,788*scale);return canvas;}

</script></html>
