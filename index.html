<!doctype html>
<html lang="ar-MA" dir="rtl"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقرير المازوط اليومي</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:#182e48;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:520px;margin:auto;padding:22px 20px}h1{font-size:28px;line-height:40px;margin:0}time{display:block;line-height:32px;margin-bottom:17px}.head,.row{display:grid;grid-template-columns:minmax(0,188fr) minmax(0,154fr);gap:8px;text-align:center}.head{background:#284a75;color:white;border-radius:10px;height:44px;align-items:center;font-weight:600;margin-bottom:11px}.head button{height:44px;background:none;color:inherit;padding:0;font-size:inherit}.row{margin-bottom:10px}.plate,.qty{height:60px;border-radius:12px}.plate{display:grid;place-items:center;background:#e5eef8;font-size:21px;font-weight:600}.qty{width:100%;text-align:center;font-size:23px;border:1px solid #bfccd6;color:inherit;background:white}.qty::placeholder{color:#657688}button,input{font-family:inherit}button{cursor:pointer;border:none;font-weight:650}.total{border-top:1px solid #c8d4df;margin-top:25px;padding:18px 8px 26px;display:flex;justify-content:space-between;font-size:20px;font-weight:650}.send{background:#127153;color:white;width:100%;height:56px;border-radius:14px;font-size:19px}dialog{width:min(94vw,420px);max-height:85vh;border:1px solid #bfccd6;border-radius:14px;color:inherit}dialog::backdrop{background:#182e4888}dialog h2{margin-top:0}dialog input,dialog button{min-height:44px;border:1px solid #bfccd6;border-radius:8px;padding:8px;font-size:16px}dialog input{min-width:0;width:100%}.editrow{display:flex;gap:6px;margin:6px 0}.actions{display:flex;gap:8px;margin:12px 0}output{font-variant-numeric:tabular-nums}#err{color:#982828}.hint{font-size:14px;line-height:22px;color:#40566d;background:#eef3f8;border-radius:10px;padding:10px;margin:8px 0}
</style>
<main><h1>تقرير المازوط اليومي</h1><time id="today"></time>
<form id="report"><div class="head"><button type="button" id="manage" aria-label="رقم الشاحنة، تعديل اللائحة ورقم واتساب">رقم الشاحنة</button><span>المازوط (لتر)</span></div>
<div id="rows"></div><div class="total"><span>المجموع</span><output id="sum">0 لتر</output></div><button class="send">إرسال عبر WhatsApp</button></form></main>
<dialog id="settings"><form id="editor"><h2>تعديل اللائحة</h2><label>رقم WhatsApp بالصيغة الدولية (اختياري)<input id="phone" type="tel" dir="ltr" placeholder="اتركه خاوي واختار المحادثة" autocomplete="off"></label><p class="hint"><strong>كيفاش كيوصل التقرير:</strong> خلي الرقم خاوي، عمّر اللترات، وضغط «إرسال عبر WhatsApp». كيتفتح WhatsApp باش تختار المحادثة ديال المالك بنفسك، بلا ما تكتب حتى رقم.</p><div id="plates"></div><button type="button" id="add">إضافة شاحنة</button><p role="alert" id="err"></p><div class="actions"><button>حفظ</button><button type="button" id="cancel">إلغاء</button></div></form></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), key='diesel.daily.config.v1';
const initial='2829 A 43|6280 A 4|7287 A 48|7745 A 42|1518 A 62|34226 A 48|11271 A 24|5778 A 47|45652 A 15|3465 A 25|31208 A 59|38236 A 40|2009 A 29|2706 A 19|73779 A 13'.split('|');
let list=initial.map((plate,i)=>({id:String(i),plate})), phone='', amounts=new Map();
try{const c=JSON.parse(localStorage.getItem(key));if(c&&Array.isArray(c.list)&&c.list.every(r=>typeof r.id==='string'&&typeof r.plate==='string')&&typeof c.phone==='string'){list=c.list;phone=c.phone}}catch{}
const digits=s=>s.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776);
function value(s){return Number(digits(s.trim()).replace(/[,٫]/g,'.'))}
function fmt(n){return new Intl.NumberFormat('en-US',{useGrouping:false,maximumFractionDigits:3}).format(n)}
function total(){return list.reduce((n,r)=>n+Math.round((value(amounts.get(r.id)||'')||0)*1000),0)/1000}
function render(){const rows=$('#rows');rows.replaceChildren();for(const r of list){const label=document.createElement('label'),plate=document.createElement('span'),q=document.createElement('input');label.className='row';plate.className='plate';plate.dir='ltr';plate.textContent=r.plate;q.className='qty';q.dir='ltr';q.inputMode='decimal';q.placeholder='0';q.value=amounts.get(r.id)||'';q.oninput=()=>{const s=digits(q.value.trim());const ok=!s||/^\d+(?:[.,٫]\d{1,3})?$/.test(s)&&Number.isSafeInteger(Math.round(value(s)*1000));q.setCustomValidity(ok?'':'دخل عدد لترات صحيح، حتى 3 أرقام بعد الفاصلة');amounts.set(r.id,ok?q.value:'');$('#sum').textContent=fmt(total())+' لتر'};label.append(plate,q);rows.append(label)}$('#sum').textContent=fmt(total())+' لتر'}
function date(){const now=new Date();$('#today').textContent=new Intl.DateTimeFormat('ar-MA-u-nu-latn',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(now);return $('#today').textContent}
function clock(){date();const n=new Date();setTimeout(clock,new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n+50)}clock();document.addEventListener('visibilitychange',date);
function editRow(r){const line=document.createElement('div'),i=document.createElement('input'),b=document.createElement('button');line.className='editrow';i.dir='ltr';i.required=true;i.value=r.plate;i.dataset.id=r.id;i.setAttribute('aria-label','الماتريكول');b.type='button';b.textContent='حذف';b.onclick=()=>line.remove();line.append(i,b);$('#plates').append(line);return i}
function manage(msg=''){$('#phone').value=phone;$('#plates').replaceChildren();list.forEach(editRow);$('#err').textContent=msg;$('#settings').showModal()}
$('#manage').onclick=()=>manage();$('#add').onclick=()=>editRow({id:crypto.randomUUID(),plate:''}).focus();$('#cancel').onclick=()=>$('#settings').close();
$('#editor').onsubmit=e=>{e.preventDefault();const p=digits($('#phone').value).replace(/[\s()-]/g,'').replace(/^\+/,'');if(p&&!/^[1-9]\d{6,14}$/.test(p))return $('#err').textContent='راجع الرقم الدولي مع رمز البلد.';const next=[...document.querySelectorAll('#plates input')].map(i=>({id:i.dataset.id,plate:i.value.trim().toUpperCase().replace(/\s+/g,' ')}));if(next.some(r=>!r.plate)||new Set(next.map(r=>r.plate)).size!==next.length)return $('#err').textContent='راجع الماتريكولات الفارغة أو المكررة.';try{localStorage.setItem(key,JSON.stringify({list:next,phone:p}))}catch{return $('#err').textContent='المتصفح ما سمحش بالحفظ المحلي.'}list=next;phone=p;render();$('#settings').close()};
function message(){return ['تقرير المازوط اليومي — '+date(),...list.map(r=>r.plate+': '+fmt(value(amounts.get(r.id)||''))+' لتر'),'المجموع: '+fmt(total())+' لتر'].join('\n')}
$('#report').onsubmit=e=>{e.preventDefault();const text=encodeURIComponent(message());location.href=phone?'https://wa.me/'+phone+'?text='+text:'https://wa.me/?text='+text};render();
</script></html>
